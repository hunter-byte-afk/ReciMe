<!DOCTYPE html>
<html>
    <head>
        <link rel = "stylesheet" href = "/style.css">
    </head>
    <body>
        <!-- Navagation Bar Inormation Here -->
        <div class = "navbar">
            <ul>
                <li class = "logout"> <a href = ""> Logout </a></li>
                <li class = "selected"> <a href = "pantry.html"> Pantry </a></li>
                <li> <a href = "prep.html"> Meal Prep </a></li>
                <li> <button class = "addRecipeBtn" onclick = "on()"> Add Recipe </button></li>
                <li style = "float: left"> <a href = "/index.html"> ReciMe </a></li>
            </ul>
        </div>

        <!-- Add Recipe Overlay -->
        <div id = "overlay" onclick = "off()"></div>

        <!-- Transfered html from "addRecipe.html that was coded by Mason "-->
        <div class="addRecipePage" id = "recipePage" onclick = "off()">

            <div class="formContainer">
                <h1>Add New Recipe</h1>

                <form id="recipeForm">
                    <input name="name" placeholder="Name">
                    <input name="description" placeholder="Description">
                    <select name="meal_type">
                        <option value="">Select Meal Type</option>
                        <option value="breakfast">Breakfast</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Dinner</option>
                        <option value="dessert">Dessert</option>
                        <option value="snack">Snack</option>
                    </select>

                    <div class="cookTimes">
                        <input name="cook_time" placeholder="Cook Time">
                        <input name="prep_time" placeholder="Prep Time">
                    </div>

                    <input name="servings" placeholder="Servings">

                    <select name="rating">
                        <option value="">Select Rating</option>
                        <option value="1">1 Star</option>
                        <option value="2">2 Star</option>
                        <option value="3">3 Star</option>
                        <option value="4">4 Star</option>
                        <option value="5">5 Star</option>
                    </select>

                    <textarea name="instructions" placeholder="Add Instructions..."></textarea>

                    <button type="submit">Add Recipe</button>
                </form>

                <p id="status"></p>

            </div>

        </div>

        <!-- Basic search buttons -->
        <div class = basicFilter>
            <button onclick = "filterClasses('all')"> All </button>
            <button onclick = "filterClasses('breakfast')"> Breakfast </button>
            <button onclick = "filterClasses('lunch')"> Lunch </button>
            <button onclick = "filterClasses('dinner')"> Dinner </button>
            <button onclick = "filterClasses('dessert')"> Dessert </button>
            <button onclick = "filterClasses('snack')"> Snacks </button>
        </div>

        <div class = "pantry">
            <!-- Search section to gather specfic recipes. -->
            <div class = "search">
                <br>
                <div class = "topic">
                    <p> Rating </p>
                    <form>
                        <input type = "radio" id = "oneS" name = "rating" value="1">
                        <label for = "oneS"> 1 Star </label>
                        <br>
                        <input type = "radio" id = "twoS" name = "rating" value="2">
                        <label for = "twoS"> 2 Star </label>
                        <br>
                        <input type = "radio" id = "threeS" name = "rating" value="3">
                        <label for = "threeS"> 3 Star </label>
                        <br>
                        <input type = "radio" id = "fourS" name = "rating" value="4">
                        <label for = "fourS"> 4 Star </label>
                        <br>
                        <input type = "radio" id = "fiveS" name = "rating" value="5">
                        <label for = "fiveS"> 5 Star </label>
                    </form>
                </div>

                <div class = "topic">
                    <p> Meal Type </p>
                    <form>
                        <input type = "radio" id = "breakfast" name = "mealType">
                        <label for = "breakfast"> Breakfast </label>
                        <br>
                        <input type = "radio" id = "lunch" name = "mealType">
                        <label for = "lunch"> Lunch </label>
                        <br>
                        <input type = "radio" id = "dinner" name = "mealType">
                        <label for = "dinner"> Dinner </label>
                        <br>
                        <input type = "radio" id = "dessert" name = "mealType">
                        <label for = "dessert"> Desert </label>
                        <br>
                        <input type = "radio" id = "snack" name = "mealType">
                        <label for = "snack"> Snack </label>
                    </form>
                </div>

                <button id="searchBtn"> Search </button>
                <br>
            </div>
            
            <!-- Main buttons for general sections -->
            <div class = "searchBtn">

            </div>

            <!-- Container for laying out all or specific recipes. -->
            <div class = "recipeIndex">
                <div class = "recipeCard">
                    <!-- Recipe Name -->
                    <h2></h2>
                    <!-- Recipe Description -->
                    <p></p>
                </div>
            </div>
        </div>


        <div id="recipeModal" class="modal">
            <div class="modalContent">
                <span id="closeModal">&times;</span>
                <div id="modalBody"></div>
            </div>
        </div>
        <!-- Just testing the search can work -->
        <script>

            // function for loading recipes on page load
            async function loadRecipes(url = "http://localhost:3000/recipes") {
                    try {
                        const res = await fetch(url);
                        const data = await res.json();

                        console.log(data);

                        const container = document.querySelector(".recipeIndex");
                        container.innerHTML = "";

                        if (data.length === 0) {
                            container.innerHTML = "<p>No recipes found</p>";
                            return;
                        }

                        // creates cards for each recipe
                        data.forEach(recipe => {
                            const card = document.createElement("div");
                            card.classList.add("recipeCard");

                            card.innerHTML = `
                                <h2>${recipe.name}</h2>
                                <p>${recipe.description || ""}</p>
                                <p>Cook Time: ${recipe.cook_time} min</p>
                                <p>Servings: ${recipe.servings}</p>
                            `;

                            // Click logic, click on card it expands into its own window overlay
                            card.addEventListener("click", () => {
                                const modal = document.getElementById("recipeModal");
                                const modalBody = document.getElementById("modalBody");

                                modalBody.innerHTML = `
                                    <h1>${recipe.name}</h1>
                                    <p><strong>Description:</strong> ${recipe.description || ""}</p>
                                    <p><strong>Cook Time:</strong> ${recipe.cook_time} min</p>
                                    <p><strong>Prep Time:</strong> ${recipe.prep_time} min</p>
                                    <p><strong>Servings:</strong> ${recipe.servings}</p>
                                    <h3>Instructions</h3>
                                    <p>${recipe.instructions || "No instructions available."}</p>
                                `;

                                modal.style.display = "block";
                            });


                            container.appendChild(card);
                        });

                    } catch (err) {
                        console.error(err);
                    }
                } // end load recipes function


                // Load all recipes automatically when page opens
                loadRecipes();


                // Search button filtering
                document.getElementById("searchBtn").addEventListener("click", async () => {

                    const rating = document.querySelector('input[name="rating"]:checked')?.value;
                    const mealType = document.querySelector('input[name="mealType"]:checked')?.id;

                    const url = new URL("http://localhost:3000/recipes/search");

                    if (rating) url.searchParams.append("rating", rating);
                    if (mealType) url.searchParams.append("mealType", mealType);

                    console.log(url.toString());

                    loadRecipes(url);
                });

                // close recipe window logic
                document.getElementById("closeModal").addEventListener("click", () => {
                    document.getElementById("recipeModal").style.display = "none"
                });
                
                window.addEventListener("click", (e) => {
                    const modal = document.getElementById("recipeModal");
                    if (e.target === modal) {
                        modal.style.display = "none";
                    }
                });

            /*Overlay*/
            function on(){
                document.getElementById("recipePage").style.display = "flex";
            }

            function off(){
                document.getElementById("recipePage").style.display = "none";
            }

            /* Script code below was done by Mason */
            document.getElementById("recipeForm").addEventListener("submit", async (e) => {
                e.preventDefault();

                const formData = new FormData(e.target);

                const data = Object.fromEntries(formData.entries());
                console.log(data)
                try {
                    const response = await fetch("http://localhost:3000/recipes", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();
                    // console.log(result);

                    document.getElementById("status").innerText = "Recipe added successfully! ID: " + result.recipeId;

                    e.target.reset();

                    loadRecipes();

                }
                catch (err) {
                    console.error(err);
                    document.getElementById("status").innerText = 
                    "Error adding recipe";
                }
            });
        </script>        
    </body>
</html>
