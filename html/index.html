<!DOCTYPE html>
<html>
    <head>
        <link rel = "stylesheet" href = "/style.css">
    </head>
    <body>
        <!-- Navagation Bar Inormation Here -->
        <div class = "navbar">
            <ul>
                <li class = "logout"> <a href = ""> Logout </a></li>
                <li> <a href = "/pantry.html"> Pantry </a></li>
                <li> <a href = "/prep.html"> Meal Prep </a></li>
                <li> <button class = "addRecipeBtn" onclick = "on()"> Add Recipe </button></li>
                <li class = "selected" style = "float: left"> <a href = "/index.html"> ReciMe </a></li>
            </ul>
        </div>

        <!-- Transfered html from "addRecipe.html that was coded by Mason "-->
        <div class="addRecipePage" id = "recipePage" onclick = "off()">

            <div class="formContainer" onclick = "event.stopPropagation()">
                <h1>Add New Recipe</h1>

                <form id="recipeForm">
                    <input name="name" placeholder="Name">
                    <input name="description" placeholder="Description">
                    <select name="meal_type">
                        <option value="">Select Meal Type</option>
                        <option value="breakfast">Breakfast</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Dinner</option>
                        <option value="dessert">Dessert</option>
                        <option value="snack">Snack</option>
                    </select>

                    <div class="cookTimes">
                        <input name="cook_time" placeholder="Cook Time">
                        <input name="prep_time" placeholder="Prep Time">
                    </div>

                    <input name="servings" placeholder="Servings">
                    
                    <select name="rating">
                        <option value="">Select Rating</option>
                        <option value="1">1 Star</option>
                        <option value="2">2 Star</option>
                        <option value="3">3 Star</option>
                        <option value="4">4 Star</option>
                        <option value="5">5 Star</option>
                    </select>

                    <textarea name="instructions" placeholder="Add Instructions..."></textarea>

                    <button type="submit">Add Recipe</button>
                </form>

                <p id="status"></p>

            </div>

        </div>

        <div class = "home">
            <!-- Grocery List Informaiton Here-->
            <div class = "grocery">
                <div class = "groceryLabel">
                    <h2> Grocery List </h2>
                </div>

                <div class = "list">
                    <input type = "text" id = "newItem" name = "item" placeholder= "New item...">
                    <button type="button"> Add Item </button>

                    <ul id="groceryList">
                        <li> Sugar </li> 
                        <li> Cinnamon </li>
                        <li> Rice </li>
                    </ul>
                </div>
            </div>

            <!-- Pinboard Information Here -->
            <div class = "pinboard">
                <div class = "pinItem">
                    <button> + </button>
                </div>
                <div class = "pinItem"></div>
                <div class = "pinItem"></div>
                <div class = "pinItem"></div>
                <div class = "pinItem"></div>
            </div>
        </div>

        <script>
            function on(){
                document.getElementById("recipePage").style.display = "flex";
            }

            function off(){
                document.getElementById("recipePage").style.display = "none";
            }

            /* Script code below was done by Mason */
            document.getElementById("recipeForm").addEventListener("submit", async (e) => {
                e.preventDefault();

                const formData = new FormData(e.target);

                const data = Object.fromEntries(formData.entries());

                try {
                    const response = await fetch("http://localhost:3000/recipes", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();
                    console.log(result);

                    document.getElementById("status").innerText = "Recipe added successfully! ID: " + result.recipeId;

                    e.target.reset();

                }
                catch (err) {
                    console.error(err);
                    document.getElementById("status").innerText = 
                    "Error adding recipe";
                }
            });

            document.querySelector(".list button").addEventListener("click", async () => {
                const input = document.getElementById("newItem");

                const data = input.value.trim();
    
                try {
                    const response = await fetch("http://localhost:3000/ingredients", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            name: data
                        })
                    });

                    const result = await response.json();
                    console.log(result);

                    input.value = ""; // clear input
                    loadIngredients(); // refresh list

                } catch (err) {
                    console.error(err);
                }
            });

            async function loadIngredients() {
                try {
                    const res = await fetch('/ingredients');
                    const data = await res.json()

                    const list = document.getElementById('groceryList');
                    list.innerHTML = '';

                    data.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = item.name + " ";

                        const dltBtn = document.createElement('button');
                        dltBtn.textContent = "X";

                        dltBtn.addEventListener("click", async () => {
                            await fetch(`http://localhost:3000/ingredients/${item.ingredient_id}`, {
                                method: "DELETE"
                            });
                            loadIngredients() // reloads ingredient list after delete
                        });
                        li.appendChild(dltBtn); // adds delete button to ingredient item
                        list.appendChild(li); // adds ingredient item to groceryList
                    });
                }
                catch (err) {
                    console.error('Error loading ingredients: ', err);
                }
            }

            loadIngredients();
        </script>

    </body>
</html>
