<!DOCTYPE html>
<html>
    <head>
        <link rel = "stylesheet" href = "/html/style.css">
    </head>
    <body>
        <!-- Navagation Bar Inormation Here -->
        <div class = "loggedoutnavbar">
            <ul>    
                
                <li> Reviews </li>
                <li> Pantry </li>
                <li> Meal Prep </li>
                <li> Add Recipe </li>
                <li class = "selected" style = "float: left"> ReciMe </li>
            </ul>
        </div>

        
        <!-- Login Information Here -->
        <div class = "login">
            <h2 class = "formtext"> Enter your name </h2>

            <div class = "form">
            <form id="loginform">
                <input type="text" name="name">
                <input type="submit" value="login"> 
            </form>

            </div>
        </div>
        
        <script>
            document.getElementById("loginform").addEventListener("submit", async (e) => {
                e.preventDefault();

                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                try{
                    const response = await fetch("http://localhost:3000/users",{
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    });
                    const result = await response.json();
                    console.log(result);
                    //here we would set user in some kind of session manager
                    //redirect to homepage
                    window.location.href = "../homepage.html"
                }
                catch(err){
                    console.error(err);
                }
                
            });
            
        </script>   
        
    </body>
</html>
